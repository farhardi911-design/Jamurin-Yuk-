<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Jamurin Admin</title><style>body{font-family:Arial,sans-serif;background:#F6F0E4;color:#3E2718;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;margin:20px;padding:28px;background:#fffdf8;border-radius:20px;text-align:center;box-shadow:0 10px 30px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#2E4A2F;color:white;font-weight:700;cursor:pointer}</style></head><body><div class="box"><h1>Jamurin Admin</h1><p>Dashboard admin sekarang diproteksi dari server Google Apps Script.</p><p>Setelah deploy Apps Script, masukkan URL Web App di bawah.</p><input id="url" placeholder="https://script.google.com/.../exec" style="width:100%;padding:11px;box-sizing:border-box;margin:8px 0 12px;border:1px solid #D9C9A8;border-radius:10px"><button onclick="go()">Buka Dashboard</button></div><script>function go(){const u=document.getElementById('url').value.trim();if(u)location.href=u;}</script></body></html>
